<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>برنامه زمانی کلاس</title>
    <style>
        body {
            font-family: 'Vazir';
        }
    </style>
</head>

<body dir="rtl">
    <table border="1" style="border-collapse: collapse;">
    <caption>برنامه زمانی</caption>
        <thead>
            <tr>
                <th id="time" rowspan="2" scope="col">ساعت</th>
                <th id="day" colspan="5">روز</th>
            </tr>
            <tr>
                <th scope="col">شنبه</th>
                <th scope="col">یکشتبه</th>
                <th scope="col">دوشنبه</th>
                <th scope="col">سه شنبه</th>
                <th scope="col">چهار شنبه</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">8:00-9:00</th>
                <td>ریاضی</td>
                <td>علوم</td>
                <td>تاریخ</td>
                <td>ریاضی</td>
                <td>زبان</td>
            </tr>
            <tr>
                <th scope="row">9:00-10:00</th>
                <td>زبان</td>
                <td>ریاضی</td>
                <td>علوم</td>
                <td>تاریخ</td>
                <td>ریاضی</td>
            </tr>
            <tr>
                <th scope="row">10:00-11:00</th>
                <td>تاریخ</td>
                <td>زبان</td>
                <td>ریاضی</td>
                <td>علوم</td>
                <td>تاریخ</td>
            </tr>
            <tr>
                <th scope="row">11:00-12:00</th>
                <td>علوم</td>
                <td>تاریخ</td>
                <td>زبان</td>
                <td>ریاضی</td>
                <td>علوم</td>
            </tr>
        </tbody>
    </table>
    
</body>

</html>
