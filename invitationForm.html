<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Form</title>
  </head>
  <body>
    <h1>فرم دعوت‌نامه</h1>
    <form>
        <fieldset>
            <legend>اطلاعات مهمان</legend>
            <label for="name">نام و نام خانوداگی</label>
            <br>
            <input
            type="text"
            id="name" name="name"
            required>
            <br>

            <label for="email">ایمیل</label>
            <br>
            <input
            type="text"
            id="email"
            name="email"
            required>
            <br>

            <input type="radio" name="radio_name" id="male" value="male">
            <label for="male">آقا</label>
            <input type="radio" name="radio_name" id="female" value="female">
            <label for="female"> خانم</label>
            <br>

            <label>تعداد همراه</label>
            <select id="attendant">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <br>
            </select>

            <br>
            <button type="submit" id="submit">ثبت</button>
            <button type="reset" id="reset">بازنشانی</button>
        </fieldset>
    </form>
  </body>
</html>
