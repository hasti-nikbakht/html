<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>مثال کلاس‌های پسودو در CSS</title>
    <link rel="stylesheet" href="pseudo.css" />
  </head>
  <body>
    <h2>نمونه دکمه با :hover و :active</h2>
    <button class="button">هاور و کلیک مرا امتحان کنید</button>

    <h2>نمونه فرم با :focus</h2>
    <input type="text" placeholder="روی من فوکوس کنید" />

    <h2>لیست با :first-child و :last-child</h2>
    <ul>
      <li>آیتم اول</li>
      <li>آیتم دوم</li>
      <li>آیتم آخر</li>
    </ul>

    <h2>چک‌باکس با :checked</h2>
    <label> <input type="checkbox" checked /> من انتخاب شده‌ام </label>
  </body>
</html>
